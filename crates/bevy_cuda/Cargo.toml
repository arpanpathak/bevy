[package]
name = "bevy_cuda"
version = "0.20.0-dev"
edition = "2024"
description = "Zero-copy CUDA interop for Bevy render graphs"
homepage = "https://bevy.org"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "cuda", "gpu", "interop", "jetson"]

[dependencies]
bevy_app = { path = "../bevy_app", version = "0.20.0-dev" }
bevy_ecs = { path = "../bevy_ecs", version = "0.20.0-dev" }
bevy_log = { path = "../bevy_log", version = "0.20.0-dev" }
bevy_render = { path = "../bevy_render", version = "0.20.0-dev" }
thiserror = { version = "2", default-features = false }
# `bevy_render` turns on `wgpu`'s `vulkan` feature, which is what makes
# `wgpu::hal` (and therefore `as_hal::<Vulkan>` / `create_buffer_from_hal`)
# available. Cargo's feature unification makes it available here too, so we do
# not enable it a second time and risk drifting from what the renderer uses.
wgpu = { version = "30", default-features = false }

# CUDA interop is only implemented on Linux. On every other platform this crate
# still compiles, but [`CudaCapabilities`] reports `UnsupportedPlatform`.
[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
cudarc = { version = "0.19", features = ["cuda-version-from-build-system"] }

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
  "-Zunstable-options",
  "--generate-link-to-definition",
  "--generate-macro-expansion",
]
all-features = true
